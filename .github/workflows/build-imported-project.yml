name: Build One App imported project
run-name: One App build worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# This public repository receives no One App secret. GitHub supplies only a short-lived
# OIDC identity for each run; One App verifies the exact repository and workflow claims.
permissions:
  id-token: write

jobs:
  build:
    name: Check the One App build queue
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Public API address only. It contains no credential and is refreshed with the One App release.
      ONE_APP_API_URL: https://3000-i4oiqd6t9mdx2qpgu4fa6-3b48ee0a.us3.manus.computer
      WORK_ROOT: /tmp/one-app-build
    steps:
      - name: Claim one pending build securely
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ONE_APP_API_URL"
          OIDC_SEPARATOR="?"
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *"?"* ]] && OIDC_SEPARATOR="&"
          OIDC_TOKEN="$(curl --fail --silent --show-error --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${OIDC_SEPARATOR}audience=one-app-build-worker" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/one-app-job.json" --write-out '%{http_code}' --header "Authorization: Bearer $OIDC_TOKEN" "$ONE_APP_API_URL/api/builds/next")"
          if [ "$STATUS" = "204" ]; then
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$STATUS" = "200"
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "build_id=$(jq -r '.id' "$RUNNER_TEMP/one-app-job.json")" >> "$GITHUB_OUTPUT"
          echo "project_type=$(jq -r '.projectType' "$RUNNER_TEMP/one-app-job.json")" >> "$GITHUB_OUTPUT"
          echo "source_url=$(jq -r '.sourceUrl' "$RUNNER_TEMP/one-app-job.json")" >> "$GITHUB_OUTPUT"
          echo "output_url=$(jq -r '.outputUrl' "$RUNNER_TEMP/one-app-job.json")" >> "$GITHUB_OUTPUT"

      - name: Download the submitted archive
        if: ${{ steps.claim.outputs.has_job == 'true' }}
        shell: bash
        env:
          SOURCE_URL: ${{ steps.claim.outputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT"
          OIDC_SEPARATOR="?"
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *"?"* ]] && OIDC_SEPARATOR="&"
          OIDC_TOKEN="$(curl --fail --silent --show-error --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${OIDC_SEPARATOR}audience=one-app-build-worker" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --header "Authorization: Bearer $OIDC_TOKEN" --output "$WORK_ROOT/source.zip" "$SOURCE_URL"
          test -s "$WORK_ROOT/source.zip"

      - name: Validate and safely extract source archive
        if: ${{ steps.claim.outputs.has_job == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT/project"
          python3 - "$WORK_ROOT/source.zip" "$WORK_ROOT/project" <<'PY'
          import os
          import stat
          import sys
          import zipfile

          archive_path, destination = sys.argv[1:]
          blocked_parts = {"node_modules", ".git", "build", "dist", ".gradle", ".idea"}
          max_files = 10_000
          max_uncompressed_bytes = 250 * 1024 * 1024

          with zipfile.ZipFile(archive_path) as archive:
              entries = archive.infolist()
              if not entries or len(entries) > max_files:
                  raise SystemExit("The archive is empty or contains too many files.")
              total = sum(entry.file_size for entry in entries)
              if total > max_uncompressed_bytes:
                  raise SystemExit("The archive expands beyond the 250 MB safety limit.")
              for entry in entries:
                  normalized = entry.filename.replace("\\", "/")
                  parts = [part for part in normalized.split("/") if part not in ("", ".")]
                  if normalized.startswith("/") or ".." in parts or any(part in blocked_parts for part in parts):
                      raise SystemExit(f"Unsafe or unsupported archive entry: {entry.filename}")
                  mode = entry.external_attr >> 16
                  if stat.S_IFMT(mode) == stat.S_IFLNK:
                      raise SystemExit(f"Symbolic links are not allowed: {entry.filename}")
              for entry in entries:
                  target = os.path.realpath(os.path.join(destination, entry.filename))
                  if not target.startswith(os.path.realpath(destination) + os.sep):
                      raise SystemExit("Archive path escapes its destination.")
                  archive.extract(entry, destination)
          PY

      - name: Locate project root
        if: ${{ steps.claim.outputs.has_job == 'true' }}
        shell: bash
        env:
          PROJECT_TYPE: ${{ steps.claim.outputs.project_type }}
        run: |
          set -euo pipefail
          case "$PROJECT_TYPE" in
            expo) marker="package.json" ;;
            android) marker="settings.gradle" ;;
            html) marker="index.html" ;;
            *) echo "Unsupported project type." >&2; exit 1 ;;
          esac
          if [ "$PROJECT_TYPE" = "android" ]; then
            PROJECT_ROOT="$(find "$WORK_ROOT/project" -maxdepth 3 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -printf '%h\n' | head -n 1)"
          else
            PROJECT_ROOT="$(find "$WORK_ROOT/project" -maxdepth 3 -type f -name "$marker" -printf '%h\n' | head -n 1)"
          fi
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Node.js for Expo builds
        if: ${{ steps.claim.outputs.project_type == 'expo' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm for Expo builds
        if: ${{ steps.claim.outputs.project_type == 'expo' }}
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install Expo project dependencies
        if: ${{ steps.claim.outputs.project_type == 'expo' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Generate Android project from Expo source
        if: ${{ steps.claim.outputs.project_type == 'expo' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          npx expo prebuild --platform android --non-interactive --clean
          echo "ANDROID_ROOT=$PROJECT_ROOT/android" >> "$GITHUB_ENV"

      - name: Select supplied Android project
        if: ${{ steps.claim.outputs.project_type == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_ROOT/settings.gradle" || test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -d "$PROJECT_ROOT/app"
          test -f "$PROJECT_ROOT/gradlew"
          chmod +x "$PROJECT_ROOT/gradlew"
          echo "ANDROID_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Create an Android wrapper for static HTML
        if: ${{ steps.claim.outputs.project_type == 'html' }}
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT="$WORK_ROOT/html-android"
          APP_SUFFIX="$(echo '${{ steps.claim.outputs.build_id }}' | tr -cd 'a-zA-Z0-9' | tr '[:upper:]' '[:lower:]')"
          APP_PACKAGE="space.oneapp.html.${APP_SUFFIX}"
          APP_PACKAGE_PATH="${APP_PACKAGE//./\/}"
          mkdir -p "$ANDROID_ROOT/app/src/main/java/$APP_PACKAGE_PATH" "$ANDROID_ROOT/app/src/main/assets"
          cp -R "$PROJECT_ROOT"/. "$ANDROID_ROOT/app/src/main/assets/"
          cat > "$ANDROID_ROOT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "OneAppHtml"
          include ':app'
          EOF
          cat > "$ANDROID_ROOT/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > "$ANDROID_ROOT/app/build.gradle" <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$APP_PACKAGE'
              compileSdk 35
              defaultConfig { applicationId '$APP_PACKAGE'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > "$ANDROID_ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme" android:label="One App HTML"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          mkdir -p "$ANDROID_ROOT/app/src/main/res/values"
          echo '<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>' > "$ANDROID_ROOT/app/src/main/res/values/styles.xml"
          cat > "$ANDROID_ROOT/app/src/main/java/$APP_PACKAGE_PATH/MainActivity.java" <<EOF
          package $APP_PACKAGE;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              WebView view = new WebView(this);
              WebSettings settings = view.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              view.loadUrl("file:///android_asset/index.html");
              setContentView(view);
            }
          }
          EOF
          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: Set up Java
        if: ${{ steps.claim.outputs.has_job == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: ${{ steps.claim.outputs.has_job == 'true' }}
        uses: android-actions/setup-android@v3

      - name: Build debug APK from Expo or Android source
        if: ${{ steps.claim.outputs.project_type == 'expo' || steps.claim.outputs.project_type == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build debug APK from HTML source
        if: ${{ steps.claim.outputs.project_type == 'html' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          curl --fail --location --proto '=https' --tlsv1.2 --output gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          ./gradle-8.10.2/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        if: ${{ steps.claim.outputs.has_job == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find "$ANDROID_ROOT/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          mkdir -p "$WORK_ROOT/output"
          cp "$APK_PATH" "$WORK_ROOT/output/one-app-${{ steps.claim.outputs.build_id }}.apk"

      # The imported project may run installation or build scripts. It therefore
      # never receives contents:write. The APK is passed as a short-lived
      # Actions artifact to a separate, trusted publisher workflow.
      - name: Keep APK briefly for the trusted publisher
        if: ${{ steps.claim.outputs.has_job == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: one-app-${{ steps.claim.outputs.build_id }}
          path: ${{ env.WORK_ROOT }}/output/one-app-${{ steps.claim.outputs.build_id }}.apk
          if-no-files-found: error
          retention-days: 2

      - name: Report the result securely
        if: ${{ always() && steps.claim.outputs.has_job == 'true' }}
        shell: bash
        env:
          BUILD_ID: ${{ steps.claim.outputs.build_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          OIDC_SEPARATOR="?"
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *"?"* ]] && OIDC_SEPARATOR="&"
          OIDC_TOKEN="$(curl --fail --silent --show-error --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${OIDC_SEPARATOR}audience=one-app-build-worker" | jq -r '.value')"
          # A successful build is reported by the isolated publisher only after
          # GitHub has accepted the APK release. This worker reports failures.
          if [ "$JOB_STATUS" = "success" ]; then
            exit 0
          fi
          curl --fail --show-error --request POST --header "Authorization: Bearer $OIDC_TOKEN" --header "Content-Type: application/json" --data '{"outcome":"failed"}' "$ONE_APP_API_URL/api/builds/$BUILD_ID/complete"
