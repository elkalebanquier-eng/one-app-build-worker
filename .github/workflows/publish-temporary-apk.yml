name: Publish temporary One App APK
run-name: Publish temporary One App APK

on:
  workflow_run:
    workflows: ["Build One App imported project"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# This workflow runs from the trusted default branch and never executes source
# code imported by a One App user. It is the sole workflow with repository write
# access, narrowly limited to the temporary release lifecycle.
permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the temporary Android artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("one-app-build-"))) | .name' | head -n 1)"
          if [ -z "$ARTIFACT_NAME" ]; then
            echo "has_artifact=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILD_ID="${ARTIFACT_NAME#one-app-}"
          case "$BUILD_ID" in build-????????????*) ;; *) echo "Invalid build identifier" >&2; exit 1 ;; esac
          echo "has_artifact=true" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download the Android artifact
        if: ${{ steps.artifact.outputs.has_artifact == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/one-app-artifact"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/one-app-artifact"
          METADATA="$RUNNER_TEMP/one-app-artifact/one-app-${{ steps.artifact.outputs.build_id }}.json"
          test -f "$METADATA"
          ARTIFACT_TYPE="$(jq -r '.artifactType // "apk"' "$METADATA")"
          case "$ARTIFACT_TYPE" in apk|aab) ;; *) echo "Invalid Android artifact type" >&2; exit 1 ;; esac
          test -f "$RUNNER_TEMP/one-app-artifact/one-app-${{ steps.artifact.outputs.build_id }}.$ARTIFACT_TYPE"
          COMPLETION_URL="$(jq -r '.completionUrl' "$METADATA")"
          PROGRESS_URL="${COMPLETION_URL/publisher-complete/publisher-progress}"
          if [ "$ARTIFACT_TYPE" = "aab" ]; then MESSAGE="Fichier AAB reçu. Vérification finale avant publication."; else MESSAGE="APK reçue. Vérification finale avant publication."; fi
          jq -n --argjson progress 92 --arg message "$MESSAGE" '{progress: $progress, message: $message}' | curl --fail --silent --show-error --request POST --header "Content-Type: application/json" --data-binary @- "$PROGRESS_URL" || true

      - name: Set up Java for artifact signing
        if: ${{ steps.artifact.outputs.has_artifact == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sign Android release artifact and prepare private key backup
        if: ${{ steps.artifact.outputs.has_artifact == 'true' }}
        shell: bash
        env:
          BUILD_ID: ${{ steps.artifact.outputs.build_id }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/one-app-artifact"
          METADATA="$ARTIFACT_DIR/one-app-$BUILD_ID.json"
          BUILD_MODE="$(jq -r '.buildMode // "debug"' "$METADATA")"
          ARTIFACT_TYPE="$(jq -r '.artifactType // "apk"' "$METADATA")"
          case "$BUILD_MODE:$ARTIFACT_TYPE" in debug:apk|signed:apk|aab:aab) ;; *) echo "Invalid build artifact contract" >&2; exit 1 ;; esac
          ARTIFACT="$ARTIFACT_DIR/one-app-$BUILD_ID.$ARTIFACT_TYPE"
          test -f "$ARTIFACT"
          COMPLETION_URL="$(jq -r '.completionUrl' "$METADATA")"
          PROGRESS_URL="${COMPLETION_URL/publisher-complete/publisher-progress}"
          if [ "$ARTIFACT_TYPE" = "aab" ]; then MESSAGE="Vérification finale du fichier AAB en cours."; else MESSAGE="Vérification finale de l’APK en cours."; fi
          jq -n --argjson progress 94 --arg message "$MESSAGE" '{progress: $progress, message: $message}' | curl --fail --silent --show-error --request POST --header "Content-Type: application/json" --data-binary @- "$PROGRESS_URL" || true
          if [ "$BUILD_MODE" = "debug" ]; then
            echo "key_backup_path=" >> "$GITHUB_ENV"
            exit 0
          fi

          KEYSTORE="$RUNNER_TEMP/one-app-$BUILD_ID.jks"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$KEYSTORE" -storetype JKS -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -alias oneapp -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=One App $BUILD_ID, OU=One App, O=One App, C=FR" -noprompt
          if [ "$ARTIFACT_TYPE" = "aab" ]; then
            jarsigner -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 "$ARTIFACT" oneapp
            jarsigner -verify -verbose "$ARTIFACT"
          else
            ALIGNED_APK="$RUNNER_TEMP/one-app-$BUILD_ID-aligned.apk"
            SIGNED_APK="$RUNNER_TEMP/one-app-$BUILD_ID-signed.apk"
            BUILD_TOOLS="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            test -x "$BUILD_TOOLS/apksigner"
            test -x "$BUILD_TOOLS/zipalign"
            "$BUILD_TOOLS/zipalign" -p -f 4 "$ARTIFACT" "$ALIGNED_APK"
            "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias oneapp --ks-pass "pass:$KEY_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out "$SIGNED_APK" "$ALIGNED_APK"
            "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
            mv "$SIGNED_APK" "$ARTIFACT"
          fi

          INFO_FILE="$RUNNER_TEMP/MOT-DE-PASSE-ET-INFOS-$BUILD_ID.txt"
          cat > "$INFO_FILE" <<EOF
          IMPORTANT — clé et mot de passe de signature MIA💻

          Cette clé signe l’application Android : $BUILD_ID
          Nom de fichier de la clé : one-app-$BUILD_ID.jks
          Alias : oneapp
          Mot de passe : $KEY_PASSWORD

          Gardez ce ZIP dans un endroit privé, hors ligne si possible.
          Ne donnez jamais cette clé ni ce mot de passe à une autre personne.
          Ils sont nécessaires pour publier une mise à jour de la même application Android.
          Pour un fichier AAB, gardez impérativement cette clé avant tout envoi ou suivi sur Google Play.
          EOF
          KEY_BACKUP="$RUNNER_TEMP/one-app-cle-$BUILD_ID.zip"
          zip -j -q "$KEY_BACKUP" "$KEYSTORE" "$INFO_FILE"
          test -s "$KEY_BACKUP"
          echo "key_backup_path=$KEY_BACKUP" >> "$GITHUB_ENV"

      - name: Publish a temporary Android artifact release for 48 hours
        if: ${{ steps.artifact.outputs.has_artifact == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.artifact.outputs.build_id }}
        run: |
          set -euo pipefail
          TAG="one-app-build-$BUILD_ID"
          ARTIFACT_DIR="$RUNNER_TEMP/one-app-artifact"
          METADATA="$ARTIFACT_DIR/one-app-$BUILD_ID.json"
          ARTIFACT_TYPE="$(jq -r '.artifactType // "apk"' "$METADATA")"
          case "$ARTIFACT_TYPE" in apk|aab) ;; *) echo "Invalid Android artifact type" >&2; exit 1 ;; esac
          ARTIFACT="$ARTIFACT_DIR/one-app-$BUILD_ID.$ARTIFACT_TYPE"
          test -f "$ARTIFACT"
          COMPLETION_URL="$(jq -r '.completionUrl' "$METADATA")"
          PROGRESS_URL="${COMPLETION_URL/publisher-complete/publisher-progress}"
          if [ "$ARTIFACT_TYPE" = "aab" ]; then MESSAGE="Publication sécurisée du fichier AAB en cours."; TITLE="AAB One App temporaire"; NOTES="Fichier AAB créé par One App. Suppression automatique après 48 heures."; else MESSAGE="Publication sécurisée de l’APK en cours."; TITLE="APK One App temporaire"; NOTES="APK créée par One App. Suppression automatique après 48 heures."; fi
          jq -n --argjson progress 97 --arg message "$MESSAGE" '{progress: $progress, message: $message}' | curl --fail --silent --show-error --request POST --header "Content-Type: application/json" --data-binary @- "$PROGRESS_URL" || true
          gh release create "$TAG" "$ARTIFACT#one-app-$BUILD_ID.$ARTIFACT_TYPE" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"

      - name: Confirm secure completion to One App
        if: ${{ steps.artifact.outputs.has_artifact == 'true' }}
        shell: bash
        env:
          BUILD_ID: ${{ steps.artifact.outputs.build_id }}
        run: |
          set -euo pipefail
          METADATA="$RUNNER_TEMP/one-app-artifact/one-app-$BUILD_ID.json"
          COMPLETION_URL="$(jq -r '.completionUrl' "$METADATA")"
          ARTIFACT_TYPE="$(jq -r '.artifactType // "apk"' "$METADATA")"
          case "$ARTIFACT_TYPE" in apk|aab) ;; *) echo "Invalid Android artifact type" >&2; exit 1 ;; esac
          test -n "$COMPLETION_URL" && test "$COMPLETION_URL" != "null"
          if [ -n "${key_backup_path:-}" ]; then
            KEY_BACKUP_BASE64="$(base64 -w 0 "$key_backup_path")"
            jq -n --arg keyBackupBase64 "$KEY_BACKUP_BASE64" --arg artifactType "$ARTIFACT_TYPE" '{outcome: "complete", artifactType: $artifactType, keyBackupBase64: $keyBackupBase64}' > "$RUNNER_TEMP/one-app-completion.json"
          else
            jq -n --arg artifactType "$ARTIFACT_TYPE" '{outcome: "complete", artifactType: $artifactType}' > "$RUNNER_TEMP/one-app-completion.json"
          fi
          curl --fail --show-error --request POST --header "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/one-app-completion.json" "$COMPLETION_URL"

  cleanup:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete One App APK releases older than 48 hours
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUTOFF="$(date --utc --date='48 hours ago' +%s)"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt --jq '.[] | select(.tagName | startswith("one-app-build-")) | [.tagName, .createdAt] | @tsv' | while IFS=$'\t' read -r TAG CREATED_AT; do
            [ -z "$TAG" ] && continue
            CREATED_SECONDS="$(date --utc --date="$CREATED_AT" +%s)"
            if [ "$CREATED_SECONDS" -le "$CUTOFF" ]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
